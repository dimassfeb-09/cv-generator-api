<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Data | CVGen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --brand: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .delete-card {
            background: var(--card-bg);
            max-width: 450px;
            width: 100%;
            padding: 50px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            text-align: center;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 1rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px var(--danger-soft);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-primary {
            background: var(--text-main);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #otp-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .status-error {
            background: #fef2f2;
            color: #991b1b;
        }

        .status-success {
            background: #ecfdf5;
            color: #065f46;
        }

        .back-link {
            display: inline-block;
            margin-top: 32px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--brand);
        }
    </style>
</head>

<body>

    <div class="delete-card">
        <div class="icon-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </div>

        <h1>Delete All Data</h1>
        <p>This action is permanent and will remove all your CV documents and history from our servers.</p>

        <!-- STEP 1: REQUEST OTP -->
        <div id="request-section">
            <div class="form-group">
                <label for="email">Enter your email address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <button id="req-btn" class="btn btn-primary" onclick="requestOTP()">Request Verification Code</button>
        </div>

        <!-- STEP 2: VERIFY OTP -->
        <div id="otp-section">
            <div class="form-group">
                <label for="otp">Enter 6-digit code from email</label>
                <input type="text" id="otp" maxlength="6" placeholder="123456"
                    style="text-align: center; letter-spacing: 8px; font-weight: bold;">
            </div>
            <button id="del-btn" class="btn btn-danger" onclick="executeDelete()">Confirm Permanent Deletion</button>
            <button class="btn" style="background: transparent; color: var(--text-muted); font-size: 0.8rem;"
                onclick="location.reload()">Change Email</button>
        </div>

        <div id="status" class="status-msg"></div>

        <a href="/" class="back-link">Back to Documentation</a>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const reqBtn = document.getElementById('req-btn');
        const delBtn = document.getElementById('del-btn');

        function showStatus(msg, isError = true) {
            statusDiv.innerText = msg;
            statusDiv.style.display = 'block';
            statusDiv.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
        }

        async function requestOTP() {
            const email = document.getElementById('email').value;
            if (!email) return showStatus("Please enter your email");

            reqBtn.disabled = true;
            reqBtn.innerText = "Sending...";

            try {
                const res = await fetch('/api/cv/delete/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('request-section').style.display = 'none';
                    document.getElementById('otp-section').style.display = 'block';
                    showStatus("Verification code sent to your email", false);
                } else {
                    showStatus(data.error || "Failed to send OTP");
                    reqBtn.disabled = false;
                    reqBtn.innerText = "Request Verification Code";
                }
            } catch (err) {
                showStatus("Network error. Try again.");
                reqBtn.disabled = false;
                reqBtn.innerText = "Request Verification Code";
            }
        }

        async function executeDelete() {
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otp').value;

            if (!otp || otp.length < 6) return showStatus("Enter valid 6-digit code");

            delBtn.disabled = true;
            delBtn.innerText = "Deleting permanently...";

            try {
                const res = await fetch(`/api/cv/user/${email}`, {
                    method: 'DELETE',
                    headers: {
                        'x-owner-email': email,
                        'x-verification-code': otp
                    }
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('otp-section').innerHTML = `
                    <div style="color: #065f46; font-weight: 600;">
                        <p>All your data has been successfully deleted. You will receive a confirmation email shortly.</p>
                        <button class="btn btn-primary" onclick="window.location.href='/'">Go to Home</button>
                    </div>
                `;
                    statusDiv.style.display = 'none';
                } else {
                    showStatus(data.error || "Deletion failed");
                    delBtn.disabled = false;
                    delBtn.innerText = "Confirm Permanent Deletion";
                }
            } catch (err) {
                showStatus("Network error. Try again.");
                delBtn.disabled = false;
                delBtn.innerText = "Confirm Permanent Deletion";
            }
        }
    </script>

</body>

</html>
